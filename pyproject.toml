[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshwise"
version = "0.1.0"
description = "Evidence-bounded food demand forecasting and inventory scenarios"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "ipykernel>=6,<8", "scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]
